name: content-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate content + artifacts
        run: python tools/validate.py --strict
      - name: Check catalog is up to date
        run: python tools/build.py --check
      - name: Repository health audit
        run: |
          python tools/audit.py health
          python tools/audit.py duplicates
          python tools/audit.py orphans
          python tools/audit.py urls
          python tools/audit.py documents