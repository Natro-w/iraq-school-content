name: content-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate content + artifacts
        run: python tools/validate.py --strict
      - name: Check catalog is up to date
        run: python tools/build.py --check